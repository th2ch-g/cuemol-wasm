name: Build and deploy CueMol Wasm

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: CueMol branch, tag, or commit to build
        required: true
        default: develop
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Identify dependency cache keys
        id: cache-keys
        run: uv run --no-project --python 3.12 python scripts/cache-keys.py >> "$GITHUB_OUTPUT"
      - name: Resolve CueMol source
        id: source
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
        run: |
          uv run --no-project --python 3.12 python scripts/bootstrap.py --source-only --upstream-ref "$UPSTREAM_REF"
          printf 'upstream_sha=%s\n' "$(git -C .cache/upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restore compiled CueMol engine
        id: engine-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            build/wasm
            build/core/ts/wrappers
            build/native-licenses
          key: engine-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.source.outputs.upstream_sha }}-${{ steps.cache-keys.outputs.bindings }}-${{ hashFiles('upstream.json', 'cmake/**', 'patches/**', 'src/native/**', 'scripts/build*.sh') }}
      - name: Install build tools
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build bison flex clang ccache
      - name: Restore Emscripten SDK
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/emsdk
          key: emsdk-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.toolchain }}
      - name: Restore native source archives
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/downloads
            .cache/deps
          key: sources-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.sources }}
      - name: Restore compiled dependency libraries
        id: library-cache
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/fftw
            .cache/xz
            .cache/lcms
          key: libraries-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.toolchain }}-${{ steps.cache-keys.outputs.sources }}-${{ hashFiles('scripts/build-deps.sh', 'scripts/build-env.sh', 'cmake/lcms/**') }}
      - name: Restore C++ compilation cache
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/ccache
          key: ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.toolchain }}-${{ steps.source.outputs.upstream_sha }}-${{ steps.cache-keys.outputs.bindings }}-${{ hashFiles('upstream.json', 'cmake/**', 'patches/**', 'src/native/**', 'scripts/build*.sh') }}
          restore-keys: |
            ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.toolchain }}-
      - name: Prepare native dependencies
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: uv run --no-project --python 3.12 python scripts/bootstrap.py --dependencies-only
      - name: Build dependencies
        if: steps.engine-cache.outputs.cache-hit != 'true' && steps.library-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-deps.sh
      - name: Build CueMol WebAssembly
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-wasm.sh
      - name: Refresh cached engine metadata and runtime data
        if: steps.engine-cache.outputs.cache-hit == 'true'
        run: uv run --no-project --python 3.12 python scripts/stage-runtime.py
      - name: Report native cache usage
        env:
          ENGINE_CACHE_HIT: ${{ steps.engine-cache.outputs.cache-hit }}
        run: |
          printf 'Compiled CueMol engine cache hit: `%s`\n' "$ENGINE_CACHE_HIT" >> "$GITHUB_STEP_SUMMARY"
          if [ -d .cache/ccache ]; then
            CCACHE_DIR="$PWD/.cache/ccache" ccache --show-stats >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build browser application
        run: npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy built artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
